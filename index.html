<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DEO (W-EE) Gujrat — Daily Office Attendance</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#64748b;--primary:#4f46e5;--primary2:#7c3aed;--teal:#0f766e;--success:#0f9d58;--danger:#dc2626;--warning:#d97706;--line:#e5e7eb;--shadow:0 16px 40px rgba(22,24,40,.08)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,#f8fbff 0%,#f7f4ff 55%,#eefaf6 100%);color:var(--ink)}
header{background:linear-gradient(120deg,#312e81,#6d28d9 48%,#0f766e);color:#fff;padding:20px 26px;display:flex;align-items:center;justify-content:space-between;gap:18px;position:sticky;top:0;z-index:20;box-shadow:0 10px 30px rgba(49,46,129,.22)}
.brand h1{font-size:21px;margin:0 0 5px}.brand p{margin:0;opacity:.88;font-size:13px}.topbtn{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:700}.topbtn:hover{background:rgba(255,255,255,.2)}
.container{max-width:1280px;margin:28px auto;padding:0 18px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}.card{background:var(--card);border:1px solid rgba(229,231,235,.9);border-radius:18px;box-shadow:var(--shadow);padding:20px}.span-12{grid-column:span 12}.span-8{grid-column:span 8}.span-6{grid-column:span 6}.span-4{grid-column:span 4}.span-3{grid-column:span 3}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat{padding:17px;border-radius:16px;background:linear-gradient(135deg,#fff,#f8f7ff);border:1px solid var(--line)}.stat .v{font-size:28px;font-weight:800}.stat .l{font-size:12px;color:var(--muted);margin-top:4px}.accent{border-left:5px solid var(--primary)}.ok{border-left:5px solid var(--success)}.warn{border-left:5px solid var(--warning)}.bad{border-left:5px solid var(--danger)}
h2{font-size:18px;margin:0 0 15px}h3{font-size:15px;margin:0 0 10px}.sub{color:var(--muted);font-size:13px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:180px}.field label{font-size:12px;font-weight:700;color:#475569}.field input,.field select{padding:11px 12px;border-radius:11px;border:1px solid #d9dee8;outline:none;background:#fff}.field input:focus,.field select:focus{border-color:#8b5cf6;box-shadow:0 0 0 3px rgba(124,58,237,.1)}
.btn{border:0;border-radius:11px;padding:11px 14px;font-weight:800;cursor:pointer}.primary{background:linear-gradient(90deg,var(--primary),var(--primary2));color:#fff}.secondary{background:#eef2ff;color:#4338ca}.success{background:#eaf8f0;color:#087443}.danger{background:#feecec;color:#b91c1c}.gray{background:#f1f5f9;color:#334155}.btn:disabled{opacity:.55;cursor:not-allowed}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{border-bottom:1px solid var(--line);padding:11px 9px;text-align:left;vertical-align:top}th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#64748b;background:#fafafa}tr:hover td{background:#fcfcff}.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:800}.p-present{background:#e9f8ef;color:#0b7a43}.p-absent{background:#feecec;color:#b91c1c}.p-noc{background:#fff4df;color:#b45309}.p-pending{background:#eef2ff;color:#4338ca}.p-off{background:#f1f5f9;color:#475569}
.notice{padding:12px 14px;border-radius:12px;background:#f8fafc;border:1px solid var(--line);font-size:13px;color:#475569}.notice strong{color:var(--ink)}.mini{font-size:11px;color:var(--muted)}.linkbox{word-break:break-all;background:#f8f7ff;border:1px solid #ddd6fe;padding:10px;border-radius:10px;font-size:12px}.copyok{color:#087443;font-weight:700;font-size:12px}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:25px;background:radial-gradient(circle at 15% 15%,#ddd6fe 0,#f5f7fb 35%,#ccfbf1 100%)}.login{width:min(430px,100%);background:#fff;border-radius:24px;box-shadow:0 25px 80px rgba(30,41,59,.16);padding:30px;border:1px solid #eceef3}.login .logo,.att-card .logo{width:60px;height:60px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;font-size:28px;font-weight:900;margin-bottom:15px}.hidden{display:none!important}
.employee{min-height:100vh;display:grid;place-items:center;padding:18px}.att-card{width:min(610px,100%);background:#fff;border-radius:24px;box-shadow:0 25px 80px rgba(30,41,59,.14);padding:28px;border:1px solid #eceef3}.bigbtn{width:100%;padding:16px;border-radius:14px;font-size:16px}.gps{background:#f0fdfa;border:1px solid #99f6e4;padding:11px;border-radius:11px;font-size:12px;color:#115e59}.clock{font-size:42px;font-weight:900;letter-spacing:.02em}.datehero{display:flex;justify-content:space-between;gap:15px;align-items:center;background:linear-gradient(135deg,#f5f3ff,#ecfeff);padding:16px;border-radius:16px;border:1px solid #ddd6fe}.footer{font-size:11px;color:#94a3b8;text-align:center;margin-top:20px}
.linkhero{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:16px;border-radius:16px;background:linear-gradient(135deg,#eef2ff,#ecfeff);border:1px solid #c7d2fe}.linkhero .url{font-size:13px;font-weight:700;word-break:break-all}.tag{display:inline-block;padding:5px 9px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:11px;font-weight:800;color:#475569}
@media(max-width:900px){.span-8,.span-6,.span-4,.span-3{grid-column:span 12}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){header{padding:16px}.container{padding:0 12px}.stats{grid-template-columns:1fr}.card{padding:16px}.clock{font-size:34px}.datehero{align-items:flex-start;flex-direction:column}.linkhero{align-items:stretch;flex-direction:column}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const KEY='deo_wee_attendance_shared_link_v2';
const DEFAULT={adminUser:'admin',adminPass:'admin123',officeEmail:'deoweegujrat@gmail.com',waOffice:'03420181028',officeName:'DEO (W-EE) Gujrat',lat:'',lng:'',radius:150,timings:{checkInOpen:'08:45',checkInClose:'09:15',checkOutOpen:'15:45',checkOutClose:'16:15'},employees:[],records:{}};
function db(){try{const x=JSON.parse(localStorage.getItem(KEY)||'{}');return {...DEFAULT,...x,timings:{...DEFAULT.timings,...(x.timings||{})},employees:x.employees||[],records:x.records||{}}}catch{return {...DEFAULT,timings:{...DEFAULT.timings},employees:[],records:{}}}}
function save(d){localStorage.setItem(KEY,JSON.stringify(d))}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dateLong(){return new Intl.DateTimeFormat('en-PK',{weekday:'long',year:'numeric',month:'long',day:'numeric'}).format(new Date())}
function timeNow(){return new Date().toLocaleTimeString('en-PK',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}
function isSunday(){return new Date().getDay()===0}
function minsNow(){const d=new Date();return d.getHours()*60+d.getMinutes()}
function toMins(hm){const m=/^(\d{1,2}):(\d{2})$/.exec(String(hm||''));if(!m)return NaN;return Number(m[1])*60+Number(m[2])}
function fmtHm(hm){const m=toMins(hm);if(Number.isNaN(m))return '--:--';return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
function windowState(kind){const d=db();if(isSunday())return 'closed';const mins=minsNow();const t=d.timings||DEFAULT.timings;const open=toMins(kind==='checkin'?t.checkInOpen:t.checkOutOpen);const close=toMins(kind==='checkin'?t.checkInClose:t.checkOutClose);if(Number.isNaN(open)||Number.isNaN(close)||close<open)return 'closed';if(mins<open)return 'early';return mins<=close?'open':'closed'}
function statusFor(d,eid,dt=today()){const r=d.records[dt]?.[eid];if(!r)return 'PENDING';if(r.checkIn&&r.checkOut)return 'PRESENT';if(r.absent)return 'ABSENT';if(r.noCheckout||r.checkIn)return 'NO_CHECKOUT';return 'PENDING'}
function baseUrl(){return location.href.split('#')[0]}
function dailyLink(){return baseUrl()+'#attendance'}
function hav(a,b,c,d){const R=6371000,rad=x=>x*Math.PI/180;const p1=rad(a),p2=rad(c),dp=rad(c-a),dl=rad(d-b);const x=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}
function normalizePhone(phone){let p=String(phone).replace(/\D/g,'');if(p.startsWith('0'))p='92'+p.slice(1);return p}
function waUrl(phone,text){return 'https://wa.me/'+normalizePhone(phone)+'?text='+encodeURIComponent(text)}
function renderLogin(){document.getElementById('app').innerHTML=`<div class="login-wrap"><div class="login"><div class="logo">🔐</div><h1 style="margin:0 0 6px">Admin Login</h1><div class="sub" style="margin-bottom:20px">${esc(DEFAULT.officeName)} · Administrator only</div><div class="field"><label>Username</label><input id="u" value="admin" autocomplete="username"></div><div class="field" style="margin-top:11px"><label>Password</label><input id="p" type="password" placeholder="Enter password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"></div><div id="err" class="notice hidden" style="margin:12px 0;color:#b91c1c;background:#fff1f2;border-color:#fecdd3"></div><button class="btn primary" style="width:100%;margin-top:15px" onclick="login()">Sign in as Admin</button><button class="btn gray" style="width:100%;margin-top:10px" onclick="openAttendance()">← Back to Attendance</button><div class="footer">Admin access only · Shared daily attendance</div></div></div>`}
function login(){const d=db(),u=document.getElementById('u').value.trim(),p=document.getElementById('p').value;if(u===d.adminUser&&p===d.adminPass){sessionStorage.setItem('auth','1');location.hash='admin';renderAdmin()}else{const e=document.getElementById('err');e.textContent='Invalid username or password.';e.classList.remove('hidden')}}
function logout(){sessionStorage.removeItem('auth');location.hash='';renderLogin()}
function applyTimeRules(d){if(isSunday())return;d.records[today()]??={};const rec=d.records[today()];const t=d.timings||DEFAULT.timings;const ciClose=toMins(t.checkInClose),coClose=toMins(t.checkOutClose);if(!Number.isNaN(ciClose)&&minsNow()>=ciClose){d.employees.filter(e=>e.active).forEach(e=>{rec[e.id]??={};if(!rec[e.id].checkIn&&!rec[e.id].checkOut)rec[e.id].absent=true})}if(!Number.isNaN(coClose)&&minsNow()>=coClose){d.employees.filter(e=>e.active).forEach(e=>{rec[e.id]??={};if(rec[e.id].checkIn&&!rec[e.id].checkOut)rec[e.id].noCheckout=true})}}
function dash(){const d=db();applyTimeRules(d);save(d);const c={PRESENT:0,ABSENT:0,NO_CHECKOUT:0,PENDING:0};d.employees.filter(e=>e.active).forEach(e=>c[statusFor(d,e.id)]++);return c}
function renderAdmin(){if(sessionStorage.getItem('auth')!=='1'){return renderLogin()}const d=db(),c=dash();document.getElementById('app').innerHTML=`<header><div class="brand"><h1>DEO (W-EE) Gujrat — Office Attendance</h1><p>Admin Dashboard · ${esc(d.officeEmail)} · ${esc(d.waOffice)}</p></div><button class="topbtn" onclick="logout()">Logout</button></header><main class="container"><div class="stats"><div class="stat accent"><div class="v">${c.PRESENT}</div><div class="l">Present</div></div><div class="stat bad"><div class="v">${c.ABSENT}</div><div class="l">Absent</div></div><div class="stat warn"><div class="v">${c.NO_CHECKOUT}</div><div class="l">No Checkout</div></div><div class="stat"><div class="v">${c.PENDING}</div><div class="l">Pending</div></div></div><div class="grid" style="margin-top:18px"><section class="card span-12"><div class="row" style="justify-content:space-between"><div><h2>One Daily Attendance Link</h2><div class="sub">The same link is used every day. The page automatically reads the current date and keeps records date-wise.</div></div><span class="tag">No daily re-generation</span></div><div class="linkhero" style="margin-top:14px"><div><div class="mini">SHARED LINK</div><div class="url" id="dailyUrl">${esc(dailyLink())}</div></div><div class="row"><button class="btn primary" onclick="copyDailyLink()">Copy Link</button><button class="btn success" onclick="shareDailyLink()">Share</button><button class="btn secondary" onclick="openAttendance()">Open</button></div></div><div id="copymsg" style="margin-top:8px"></div></section><section class="card span-4"><h2>Add Employee</h2><div class="field"><label>Name</label><input id="en" placeholder="Employee name"></div><div class="field" style="margin-top:10px"><label>WhatsApp / Mobile</label><input id="ew" placeholder="03XXXXXXXXX"></div><button class="btn primary" style="margin-top:12px" onclick="addEmp()">Add Employee</button><div class="notice" style="margin-top:14px">On the shared link, each employee selects their own name. GPS is checked before attendance is saved.</div></section><section class="card span-8"><div class="row" style="justify-content:space-between"><div><h2>Today’s Attendance</h2><div class="sub">${esc(dateLong())} · ${isSunday()?'Sunday — attendance skipped':'Monday–Saturday'}</div></div><div class="row"><button class="btn gray" onclick="applyAndRefresh()">Apply Time Rules</button><button class="btn secondary" onclick="exportCSV()">Export CSV</button></div></div><div style="overflow:auto;margin-top:12px"><table><thead><tr><th>Employee</th><th>WhatsApp</th><th>Check-In</th><th>Check-Out</th><th>Status</th></tr></thead><tbody>${d.employees.filter(e=>e.active).map(e=>row(e,d)).join('')||'<tr><td colspan="5" class="sub">No active employees yet.</td></tr>'}</tbody></table></div></section><section class="card span-6"><h2>Office GPS</h2><div class="row"><div class="field"><label>Latitude</label><input id="lat" value="${esc(d.lat)}" placeholder="e.g. 32.57"></div><div class="field"><label>Longitude</label><input id="lng" value="${esc(d.lng)}" placeholder="e.g. 74.08"></div><div class="field"><label>Radius (meters)</label><input id="rad" type="number" min="1" value="${esc(d.radius)}"></div></div><div class="row" style="margin-top:12px"><button class="btn primary" onclick="saveSettings()">Save GPS Settings</button><button class="btn gray" onclick="useOfficeLocation()">Use Current Location</button></div><div class="notice" style="margin-top:12px">Attendance is accepted only when the employee is inside the configured radius.</div></section><section class="card span-6"><h2>Attendance Timings</h2><div class="row"><div class="field"><label>Check-In Opens</label><input id="ciOpen" type="time" value="${esc(d.timings.checkInOpen)}"></div><div class="field"><label>Check-In Closes / Absent</label><input id="ciClose" type="time" value="${esc(d.timings.checkInClose)}"></div><div class="field"><label>Check-Out Opens</label><input id="coOpen" type="time" value="${esc(d.timings.checkOutOpen)}"></div><div class="field"><label>Check-Out Closes / No Checkout</label><input id="coClose" type="time" value="${esc(d.timings.checkOutClose)}"></div></div><div class="row" style="margin-top:12px"><button class="btn primary" onclick="saveTimings()">Save Timing Settings</button><button class="btn gray" onclick="resetTimings()">Reset Default</button></div><div class="notice" style="margin-top:12px"><strong>Admin can adjust timings anytime.</strong> The shared link automatically uses the new timings for the current and future dates.</div></section><section class="card span-12"><h2>Employees</h2><div style="overflow:auto"><table><thead><tr><th>Name</th><th>WhatsApp</th><th>Active</th><th>Send Daily Link</th><th>Actions</th></tr></thead><tbody>${d.employees.map(e=>empRow(e)).join('')||'<tr><td colspan="5" class="sub">No employees added.</td></tr>'}</tbody></table></div></section></div><div class="footer">Shared-link version · Sunday skipped · Records are keyed by date (${today()})</div></main>`}
function row(e,d){const r=(d.records[today()]||{})[e.id]||{},st=statusFor(d,e.id);const cls=st==='PRESENT'?'p-present':st==='ABSENT'?'p-absent':st==='NO_CHECKOUT'?'p-noc':'p-pending';return `<tr><td><strong>${esc(e.name)}</strong></td><td>${esc(e.phone)}</td><td>${esc(r.checkIn?.time||'—')}</td><td>${esc(r.checkOut?.time||'—')}</td><td><span class="pill ${cls}">${st}</span></td></tr>`}
function empRow(e){const msg=`Daily attendance link for ${dateLong()}:\n${dailyLink()}\nPlease select your name and mark attendance within the scheduled time.`,u=waUrl(e.phone,msg);return `<tr><td><strong>${esc(e.name)}</strong></td><td>${esc(e.phone)}</td><td><span class="pill ${e.active?'p-present':'p-off'}">${e.active?'Active':'Disabled'}</span></td><td><button class="btn success" onclick="window.open('${u}','_blank')">WhatsApp</button></td><td><button class="btn gray" onclick="toggleEmp('${e.id}')">${e.active?'Disable':'Enable'}</button> <button class="btn danger" onclick="deleteEmp('${e.id}')">Delete</button></td></tr>`}
function addEmp(){const d=db(),name=document.getElementById('en').value.trim(),phone=document.getElementById('ew').value.trim();if(!name||!phone)return alert('Enter employee name and WhatsApp number.');d.employees.push({id:uid(),name,phone,active:true});save(d);renderAdmin()}
function deleteEmp(id){if(!confirm('Delete this employee?'))return;const d=db();d.employees=d.employees.filter(e=>e.id!==id);save(d);renderAdmin()}
function toggleEmp(id){const d=db(),e=d.employees.find(x=>x.id===id);if(e)e.active=!e.active;save(d);renderAdmin()}
function saveSettings(){const d=db();d.lat=document.getElementById('lat').value.trim();d.lng=document.getElementById('lng').value.trim();d.radius=Math.max(1,Number(document.getElementById('rad').value||150));save(d);renderAdmin();alert('Office GPS settings saved.')}
function saveTimings(){const d=db();const t={checkInOpen:document.getElementById('ciOpen').value,checkInClose:document.getElementById('ciClose').value,checkOutOpen:document.getElementById('coOpen').value,checkOutClose:document.getElementById('coClose').value};const vals=[toMins(t.checkInOpen),toMins(t.checkInClose),toMins(t.checkOutOpen),toMins(t.checkOutClose)];if(vals.some(Number.isNaN))return alert('Please set all four times.');if(!(vals[0]<vals[1]))return alert('Check-In open time must be before Check-In close time.');if(!(vals[2]<vals[3]))return alert('Check-Out open time must be before Check-Out close time.');if(vals[1]>vals[2])return alert('Check-In close time should not be after Check-Out open time.');d.timings=t;save(d);renderAdmin();alert('Attendance timings saved successfully.')}
function resetTimings(){const d=db();d.timings={...DEFAULT.timings};save(d);renderAdmin();alert('Timings reset to 08:45 / 09:15 and 15:45 / 16:15.')}
function useOfficeLocation(){if(!navigator.geolocation)return alert('Geolocation is not supported.');navigator.geolocation.getCurrentPosition(p=>{document.getElementById('lat').value=p.coords.latitude.toFixed(7);document.getElementById('lng').value=p.coords.longitude.toFixed(7)},e=>alert('Unable to read your location: '+e.message),{enableHighAccuracy:true,timeout:15000})}
function applyAndRefresh(){const d=db();applyTimeRules(d);save(d);renderAdmin()}
async function copyDailyLink(){try{await navigator.clipboard.writeText(dailyLink());document.getElementById('copymsg').innerHTML='<span class="copyok">Daily link copied.</span>'}catch{prompt('Copy this daily attendance link:',dailyLink())}}
async function shareDailyLink(){const url=dailyLink();if(navigator.share){try{await navigator.share({title:'Office Daily Attendance',text:'Daily attendance link for '+dateLong(),url})}catch{}}else{copyDailyLink()}}
function openAttendance(){location.hash='attendance';renderAttendance()}
function renderAttendance(){const d=db();const active=d.employees.filter(e=>e.active);const date=today();const closed=isSunday();document.getElementById('app').innerHTML=`<div class="employee"><div class="att-card"><div class="logo">✓</div><div class="datehero"><div style="flex:1"><div class="mini">DAILY OFFICE ATTENDANCE</div><h1 style="margin:4px 0;font-size:23px">${esc(d.officeName)}</h1><div class="sub">One shared link · date-wise record</div></div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px"><button class="btn gray" onclick="location.hash='admin-login';renderLogin()">🔐 Admin Login</button><div style="text-align:right"><div class="mini">TODAY</div><strong>${esc(date)}</strong></div></div></div><div style="margin:16px 0"><div class="clock" id="clock">${timeNow()}</div><div class="sub" id="daylabel">${esc(dateLong())}</div></div>${closed?'<div class="notice" style="color:#b91c1c;background:#fff1f2;border-color:#fecdd3"><strong>Sunday:</strong> attendance is skipped today.</div>':`<div class="field"><label>Select your name</label><select id="employeeSelect" onchange="refreshAttendanceCard()"><option value="">— Select Employee —</option>${active.map(e=>`<option value="${esc(e.id)}">${esc(e.name)}</option>`).join('')}</select></div><div id="attCardBody" style="margin-top:14px"><div class="notice">Select your name to continue. GPS verification will be required before saving attendance.</div></div>`}<div class="footer">Check-In ${esc(fmtHm(d.timings.checkInOpen))}–${esc(fmtHm(d.timings.checkInClose))} · Check-Out ${esc(fmtHm(d.timings.checkOutOpen))}–${esc(fmtHm(d.timings.checkOutClose))} · GPS radius ${esc(d.radius)} m</div></div></div>`;setInterval(()=>{const c=document.getElementById('clock');if(c)c.textContent=timeNow();const newDate=today();if(newDate!==date)renderAttendance()},1000)}
function selectedEmployee(){const d=db(),id=document.getElementById('employeeSelect')?.value;return d.employees.find(e=>e.id===id&&e.active)}
function refreshAttendanceCard(){const e=selectedEmployee(),body=document.getElementById('attCardBody');if(!body)return;if(!e){body.innerHTML='<div class="notice">Select your name to continue. GPS verification will be required before saving attendance.</div>';return}const d=db(),r=d.records[today()]?.[e.id]||{},ci=!!r.checkIn,co=!!r.checkOut,stateCI=windowState('checkin'),stateCO=windowState('checkout');body.innerHTML=`<div class="notice"><strong>${esc(e.name)}</strong><br>Choose the attendance action that is currently open.</div><div id="gpsbox" class="gps" style="margin-top:12px">GPS verification is required. Your location will be checked against the office radius.</div><div class="row" style="margin-top:12px"><button class="btn success bigbtn" style="flex:1" ${ci||stateCI!=='open'?'disabled':''} onclick="submitShared('checkin')">✓ Check-In</button><button class="btn primary bigbtn" style="flex:1" ${co||stateCO!=='open'?'disabled':''} onclick="submitShared('checkout')">✓ Check-Out</button></div><div class="mini" style="margin-top:10px">${ci?'Check-In: '+esc(r.checkIn.time):'Check-In not recorded'} · ${co?'Check-Out: '+esc(r.checkOut.time):'Check-Out not recorded'}</div>`}
function submitShared(kind){const e=selectedEmployee();if(!e)return alert('Please select your name.');const state=windowState(kind);if(state!=='open'){const t=db().timings||DEFAULT.timings;return alert(kind==='checkin'?`Check-In is open from ${fmtHm(t.checkInOpen)} to ${fmtHm(t.checkInClose)}.`:`Check-Out is open from ${fmtHm(t.checkOutOpen)} to ${fmtHm(t.checkOutClose)}.`)};if(!navigator.geolocation)return alert('GPS is not available on this device.');const d0=db();if(!d0.lat||!d0.lng)return alert('Office GPS has not been configured by Admin.');navigator.geolocation.getCurrentPosition(pos=>{const d=db();d.records[today()]??={};d.records[today()][e.id]??={};const r=d.records[today()][e.id];if(kind==='checkin'){if(r.checkIn)return alert('Check-In already recorded.');const dist=hav(pos.coords.latitude,pos.coords.longitude,Number(d.lat),Number(d.lng));document.getElementById('gpsbox').innerHTML='Distance from office: <strong>'+Math.round(dist)+' m</strong>';if(dist>Number(d.radius))return alert('Attendance rejected. You are outside the allowed office radius.');r.checkIn={time:timeNow(),lat:pos.coords.latitude,lng:pos.coords.longitude};r.absent=false}else{if(!r.checkIn)return alert('Please complete Check-In first.');if(r.checkOut)return alert('Check-Out already recorded.');const dist=hav(pos.coords.latitude,pos.coords.longitude,Number(d.lat),Number(d.lng));document.getElementById('gpsbox').innerHTML='Distance from office: <strong>'+Math.round(dist)+' m</strong>';if(dist>Number(d.radius))return alert('Attendance rejected. You are outside the allowed office radius.');r.checkOut={time:timeNow(),lat:pos.coords.latitude,lng:pos.coords.longitude};r.noCheckout=false}save(d);refreshAttendanceCard();alert(kind==='checkin'?'Check-In recorded successfully.':'Check-Out recorded successfully.')},e2=>alert('Location access failed: '+e2.message),{enableHighAccuracy:true,timeout:15000,maximumAge:0})}
function exportCSV(){const d=db(),rows=[['Date','Name','WhatsApp','Check-In','Check-Out','Status']];for(const dt of Object.keys(d.records).sort()){for(const e of d.employees){const r=d.records[dt]?.[e.id]||{};rows.push([dt,e.name,e.phone,r.checkIn?.time||'',r.checkOut?.time||'',statusFor(d,e.id,dt)])}}const csv=rows.map(a=>a.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');const b=new Blob([csv],{type:'text/csv'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='office-attendance.csv';a.click();URL.revokeObjectURL(u)}
function init(){const h=location.hash;if(h==='#admin'&&sessionStorage.getItem('auth')==='1')return renderAdmin();if(h==='#admin-login')return renderLogin();return renderAttendance()}
init();
</script>
